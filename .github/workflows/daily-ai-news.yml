name: Daily AI News → Blog

on:
  # 每天北京时间 08:00（UTC 00:00）自动运行
  schedule:
    - cron: '0 0 * * *'
  # 也可以在 GitHub Actions 页面手动触发
  workflow_dispatch:
    inputs:
      date:
        description: '目标日期 (YYYY-MM-DD，默认今天 UTC)'
        required: false
        default: ''
      dry_run:
        description: '仅生成报告，不发布到博客'
        type: boolean
        required: false
        default: false
  # push 手动生成的今日报告时，直接触发发布流程
  push:
    branches:
      - main
    paths:
      - 'reports/????-??-??-ai-daily-news.md'

jobs:
  collect-and-publish:
    name: 收集 AI 资讯并发布到博客
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. 检出本仓库 ──────────────────────────────────────────────
      - name: Checkout ai-daily-news
        uses: actions/checkout@v4

      # ── 2. 配置 Python 环境 ────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      # ── 3. 检测是否存在手动生成的今日报告 ─────────────────────────
      - name: Check for pre-built report
        id: check_report
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date -u +%Y-%m-%d)
          fi
          REPORT_FILE="reports/${DATE}-ai-daily-news.md"
          if [ -f "$REPORT_FILE" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "✅ 发现手动生成的报告：$REPORT_FILE"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "ℹ️  未找到今日手动报告，将使用 Claude API + web_search 自动收集"
          fi

      # ── 4a. 如存在手动报告：直接发布到博客 ────────────────────────
      - name: Publish pre-built report to blog
        if: steps.check_report.outputs.found == 'true' && github.event.inputs.dry_run != 'true'
        env:
          BLOG_REPO_URL: https://github.com/yf-sz/coco.github.io.git
          BLOG_DEPLOY_TOKEN: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          BLOG_REPO_DIR: /tmp/blog-repo
        run: |
          REPORT_FILE="${{ steps.check_report.outputs.report_file }}"
          FILENAME=$(basename "$REPORT_FILE")
          DATE="${{ steps.check_report.outputs.date }}"

          git config --global user.name "AI Daily News Bot"
          git config --global user.email "bot@ai-daily-news"

          AUTH_URL="${BLOG_REPO_URL/https:\/\//https:\/\/${BLOG_DEPLOY_TOKEN}@}"
          git clone "$AUTH_URL" "$BLOG_REPO_DIR"

          DEST="$BLOG_REPO_DIR/_posts/$FILENAME"
          if [ -f "$DEST" ]; then
            echo "⚠️  文章已存在，跳过：$FILENAME"
            exit 0
          fi

          mkdir -p "$BLOG_REPO_DIR/_posts"
          cp "$REPORT_FILE" "$DEST"

          cd "$BLOG_REPO_DIR"
          git add "_posts/$FILENAME"
          git commit -m "docs: add AI daily news ${DATE}"
          git push origin HEAD
          echo "✅ 已发布到博客：$FILENAME"

      # ── 4b. 无手动报告：Claude API + web_search 自动收集并发布 ────
      - name: Auto-collect with Claude API and publish
        if: steps.check_report.outputs.found == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_REPO_URL: https://github.com/yf-sz/coco.github.io.git
          BLOG_DEPLOY_TOKEN: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          BLOG_REPO_DIR: /tmp/blog-repo
        run: |
          DATE="${{ steps.check_report.outputs.date }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          PUBLISH_FLAG=""
          if [ "$DRY_RUN" != "true" ]; then
            PUBLISH_FLAG="--publish"
          fi

          python generate_today.py \
            --date "$DATE" \
            $PUBLISH_FLAG \
            --verbose

      # ── 5. 上传报告为 Artifact ─────────────────────────────────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
