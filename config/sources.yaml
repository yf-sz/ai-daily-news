# ── 无 RSS 的页面（HTML 抓取）────────────────────────────────────────
# 由 page_collector.py 处理，失败则静默跳过
web_pages:
  - name: "Hype by Replicate"
    url: "https://hype.replicate.dev/"
    category: "tools"
    # 文章链接选择器（BeautifulSoup CSS selector）
    link_selector: "a[href]"
    base_url: "https://hype.replicate.dev"

  - name: "LLM Stats Leaderboard"
    url: "https://llm-stats.com/"
    category: "tools"
    link_selector: "a[href]"
    base_url: "https://llm-stats.com"

  - name: "ModelScope 首页"
    url: "https://modelscope.cn/home"
    category: "tools"
    link_selector: "a[href*='/models/'], a[href*='/datasets/'], a[href*='/studios/']"
    base_url: "https://modelscope.cn"

  - name: "AMiner AI 研究"
    url: "https://www.aminer.cn/"
    category: "research"
    link_selector: "a[href*='/pub/'], a[href*='/topic/']"
    base_url: "https://www.aminer.cn"

  - name: "Qwen Research"
    url: "https://qwen.ai/research"
    category: "research"
    link_selector: "a[href*='/research'], a[href*='/blog']"
    base_url: "https://qwen.ai"

  - name: "ByteDance Seed Research"
    url: "https://seed.bytedance.com/en/research"
    category: "research"
    link_selector: "a[href*='/research']"
    base_url: "https://seed.bytedance.com"

  - name: "Yuan-Dong Tian (Meta AI)"
    url: "https://yuandong-tian.com/"
    category: "influencer"
    link_selector: "a[href*='paper'], a[href*='blog'], a[href*='arxiv']"
    base_url: "https://yuandong-tian.com"

  - name: "SSI (Safe Superintelligence)"
    url: "https://ssi.inc"
    category: "industry"
    link_selector: "a[href]"
    base_url: "https://ssi.inc"

