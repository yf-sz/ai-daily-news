  - "large language model"
  - "LLM"
  - "transformer"
  - "diffusion model"
  - "reinforcement learning from human feedback"
  - "RLHF"
  - "multimodal"
  - "reasoning"
  - "agent"
  - "RAG"
  - "fine-tuning"

